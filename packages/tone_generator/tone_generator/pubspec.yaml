name: tone_generator
description: "Stream-based MIDI tone generator facade for Flutter with swappable backends."
version: 0.0.1

environment:
  sdk: '>=3.2.5 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.7.1
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  # No bundled assets — stock banks reference packages/sound_service/assets/
  # which must be declared in the consuming app's pubspec.yaml.
