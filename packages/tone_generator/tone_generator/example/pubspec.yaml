name: tone_generator_example
resolution: workspace
description: "Example app for the tone_generator package."
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  tone_generator: any
  sound_service_assets: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Note assets come from sound_service; they are accessible as
  # packages/sound_service/assets/notes/<stem>.mp3 because sound_service
  # declares them in its own pubspec.yaml flutter.assets section.
