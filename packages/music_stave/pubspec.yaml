name: music_stave
description: A starting point for Dart libraries or applications.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.2.3

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2
  logging: ^1.2.0

dev_dependencies:
  lints: ^2.1.0
  test: ^1.24.0
  melos: ^3.2.0

flutter:
  uses-material-design: true
#  assets:
#    - assets/
  fonts:
    - family: Noto Music
      fonts:
        - asset: assets/fonts/NotoMusic-Regular.ttf

    - family: MusiQwik
      fonts:
        - asset: fonts/Musiqwik-zRl1.ttf

    - family: Fondamento
      fonts:
        - asset: fonts/Fondamento-Regular.ttf
