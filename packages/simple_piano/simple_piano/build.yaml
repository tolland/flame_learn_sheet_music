targets:
  $default:
    builders:
      widgetbook_generator:telemetry:
        enabled: false
      source_gen|combining_builder:
        generate_for:
          - lib/**.dart
          - test/**.dart
        options:
          build_extensions:
            '^lib/{{}}.dart': 'lib/generated/{{}}.g.dart'
      freezed|freezed:
        enabled: true
        generate_for:
          - lib/**.dart
          - test/**.dart
        options:
          build_extensions:
            '^lib/{{}}.dart': 'lib/generated/{{}}.freezed.dart'
      json_serializable:
        generate_for:
          - lib/**.dart
          - test/**.dart
