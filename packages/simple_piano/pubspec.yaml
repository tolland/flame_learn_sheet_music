name: simple_piano
description: >
  This is a simple piano widget.
version: 0.0.1
homepage: https://github.com/tolland/simple_piano

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  bloc: ^8.1.4
  bloc_concurrency: ^0.2.3
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  freezed_annotation: ^2.4.1
  logging: ^1.2.0
  sound_service_util:
    path: ../sound_service_util

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  freezed: ^2.4.6
  build_runner: ^2.4.8

flutter:
    uses-material-design: true
