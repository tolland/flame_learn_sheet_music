name: simple_piano_keylistener
resolution: workspace
description: >
  Listen to keyboard events and translates to piano key events.
  Supports simple C->C4 mapping and also more complex mapping.
version: 0.0.1
homepage: https://github.com/tolland/simple_piano_keylistener

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  logging: ^1.2.0
  freezed_annotation: ^3.1.0
  virtual_keyboard_multi_language: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^3.1.0

# The following section is specific to Flutter packages.
flutter:
