name: virtual_keyboard_status
description: widget that displays the key pressed status
version: 1.0.0
repository: https://github.com/tolland/virtual_keyboard_status

environment:
  sdk: '>=3.2.5 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  #piano_widget: ^1.3.0
  logging: ^1.2.0
  piano_widget:
    path: ../piano_widget
  freezed_annotation: ^2.4.1
  flutter_bloc: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  melos: ^3.2.0
  build_runner: ^2.4.8
  freezed: ^2.4.6

flutter:
  uses-material-design: true
